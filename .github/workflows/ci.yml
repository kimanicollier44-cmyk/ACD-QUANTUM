name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Test
        run: pytest -q
      - name: Smoke — full self-checks
        run: python main.py checks
      - name: Generate Earth + Street View + Map outputs
        run: |
          python main.py kml --out acd-quantum.kml
          python main.py streetview --html --out streetview.html
          python main.py map --html --out map.html
      - name: Upload generated pages
        uses: actions/upload-artifact@v4
        with:
          name: acd-quantum-pages
          path: |
            acd-quantum.kml
            streetview.html
            map.html
